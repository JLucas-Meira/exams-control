<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exams Control — Solicitações</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar d-none d-lg-flex">
            <a class="sidebar-brand" href="dashboard.html">
                <i class="bi bi-heart-pulse"></i>
                <div>
                    <span class="sidebar-brand-title">Exams Control</span>
                    <span class="sidebar-brand-subtitle">Sistema de Regulação SUS</span>
                </div>
            </a>
            <nav class="sidebar-nav" aria-label="Navegação principal">
                <a href="dashboard.html" class="sidebar-link">
                    <i class="bi bi-speedometer2"></i>Dashboard
                </a>
                <a href="patients.html" class="sidebar-link">
                    <i class="bi bi-people"></i>Pacientes
                </a>
                <a href="procedures.html" class="sidebar-link">
                    <i class="bi bi-clipboard2-pulse"></i>Procedimentos
                </a>
                <a href="exam-requests.html" class="sidebar-link active" aria-current="page">
                    <i class="bi bi-file-earmark-medical"></i>Solicitações
                </a>
            </nav>
        </aside>

        <div class="offcanvas offcanvas-start sidebar-offcanvas d-lg-none" tabindex="-1" id="sidebarOffcanvas"
             aria-labelledby="sidebarOffcanvasLabel">
            <div class="offcanvas-header">
                <h2 class="offcanvas-title h6 mb-0" id="sidebarOffcanvasLabel">Exams Control</h2>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Fechar menu"></button>
            </div>
            <div class="offcanvas-body p-0">
                <nav class="sidebar-nav" aria-label="Navegação principal">
                    <a href="dashboard.html" class="sidebar-link">
                        <i class="bi bi-speedometer2"></i>Dashboard
                    </a>
                    <a href="patients.html" class="sidebar-link">
                        <i class="bi bi-people"></i>Pacientes
                    </a>
                    <a href="procedures.html" class="sidebar-link">
                        <i class="bi bi-clipboard2-pulse"></i>Procedimentos
                    </a>
                    <a href="exam-requests.html" class="sidebar-link active" aria-current="page">
                        <i class="bi bi-file-earmark-medical"></i>Solicitações
                    </a>
                </nav>
            </div>
        </div>

        <div class="app-main">
            <header class="app-mobile-header d-lg-none">
                <button class="btn btn-sidebar-toggle" type="button" data-bs-toggle="offcanvas"
                        data-bs-target="#sidebarOffcanvas" aria-controls="sidebarOffcanvas" aria-label="Abrir menu">
                    <i class="bi bi-list"></i>
                </button>
                <span class="sidebar-brand-title">Exams Control</span>
            </header>

            <main class="app-content">
                <div class="page-header d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h1 class="h3 mb-1">Solicitações</h1>
                        <p class="text-muted mb-0">Gerenciamento de pedidos de exames e procedimentos.</p>
                    </div>
                    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#requestModal">
                        <i class="bi bi-plus-lg me-1"></i> Nova Solicitação
                    </button>
                </div>

                <div id="alert-container" aria-live="polite"></div>

                <div class="card shadow-sm border-0">
                    <div class="card-body p-0">
                        <!-- ... existing code ... -->
                    </div>
                </div>
            </main>

            <footer class="text-center text-muted small py-4">
                Exams Control &mdash; MVP
            </footer>
        </div>
    </div>

    <!-- Modal para Nova Solicitação -->
    <div class="modal fade" id="requestModal" tabindex="-1" aria-labelledby="requestModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="requestModalLabel">Nova Solicitação</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <form id="request-form">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="patientId" class="form-label">Paciente</label>
                            <select class="form-select" id="patientId" required>
                                <option value="" selected disabled>Selecione um paciente</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="procedureId" class="form-label">Procedimento</label>
                            <select class="form-select" id="procedureId" required>
                                <option value="" selected disabled>Selecione um procedimento</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="priority" class="form-label">Prioridade</label>
                            <select class="form-select" id="priority" required>
                                <option value="" selected disabled>Selecione a prioridade</option>
                                <option value="ELECTIVE">Eletiva</option>
                                <option value="PRIORITY">Prioritária</option>
                                <option value="URGENT">Urgente</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary" id="btn-save-request">
                            <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                            Salvar Solicitação
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
    <script src="../js/exam-requests.js"></script>
</body>
</html>
